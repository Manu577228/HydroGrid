name: HydroGrid checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp verify
        working-directory: backend

  release:
    runs-on: ubuntu-24.04
    env:
      HYDROGRID_OPERATOR_ACCOUNTS: qa-operator:COORDINATOR:bf58262ea005813c0ea7f5076c02812cb83591e6afb66b22420244b8278540af
      HYDROGRID_TEST_OPERATOR_CODE: local-ci-only-ops-coordinator-access-code
      HYDROGRID_FIELD_ACCESS_CODE: local-ci-only-field-workspace-access-code
      HYDROGRID_TEST_FIELD_ACCESS_CODE: local-ci-only-field-workspace-access-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: docker compose up -d --build --wait
      - name: Wait for HydroGrid to accept requests
        run: |
          curl --fail --silent --show-error --max-time 5 --retry 25 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/api/health
      - run: npm test
        working-directory: e2e
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore
      - run: docker compose down
        if: always()
