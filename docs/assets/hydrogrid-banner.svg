<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">HydroGrid 2.0</title>
  <desc id="desc">Every SOS Counts. A teal droplet and a stylized road network on a navy background.</desc>
