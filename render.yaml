services:
  - name: hydrogrid-demo
    type: web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: HYDROGRID_DEMO_ENABLED
        value: "true"
      - key: HYDROGRID_JWT_SECRET
        generateValue: true
      - key: HYDROGRID_DATABASE_URL
        fromDatabase:
          name: hydrogrid-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hydrogrid-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hydrogrid-db
          property: password
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "24"
      - key: SERVER_TOMCAT_THREADS_MIN_SPARE
        value: "3"

databases:
  - name: hydrogrid-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: hydrogrid
    user: hydrogrid
    ipAllowList: []

