services:
  - name: hydrogrid-demo
    type: web
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: HYDROGRID_DEMO_ENABLED
        value: "true"
      - key: HYDROGRID_FRONTEND_ORIGIN
        value: https://hydrogrid-response.vercel.app
      - key: HYDROGRID_JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "24"
      - key: SERVER_TOMCAT_THREADS_MIN_SPARE
        value: "3"

